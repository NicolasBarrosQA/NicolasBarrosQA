<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 6" width="1280" height="6" fill="none" role="img" aria-label="divisor">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D8FF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00D8FF" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#4D8DFF" stop-opacity="0.85"/>
      <stop offset="82%"  stop-color="#7C5CFF" stop-opacity="0.55"/>
