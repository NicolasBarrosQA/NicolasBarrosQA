<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" fill="none" role="img" aria-label="A interseção rara: chão de fábrica, backend, qualidade, IA e produto">
  <defs>
    <linearGradient id="iObs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A10"/>
      <stop offset="60%" stop-color="#06060B"/>
      <stop offset="100%" stop-color="#0A0A11"/>
    </linearGradient>
    <linearGradient id="iTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iChrome" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#8A93A3"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D5DDE8"/>
      <stop offset="100%" stop-color="#8A93A3"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.35 0; 0.35 0; -0.35 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="iPlasma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="iCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="iMesh" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <filter id="iGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="380" rx="20" fill="url(#iObs)"/>
  <rect width="1280" height="380" rx="20" fill="url(#iMesh)"/>
  <ellipse cx="640" cy="190" rx="340" ry="200" fill="url(#iCore)"/>

  <!-- ===== connections ===== -->
  <g stroke="#2A3140" stroke-width="1.4" fill="none">
    <path d="M300 78 C 400 78, 400 168, 470 172"/>
    <path d="M300 268 C 400 268, 400 196, 470 192"/>
    <path d="M980 78 C 880 78, 880 168, 810 172"/>
    <path d="M980 268 C 880 268, 880 196, 810 192"/>
    <path d="M640 300 L 640 228"/>
  </g>
  <g stroke="url(#iPlasma)" stroke-width="1.6" fill="none" stroke-dasharray="7 190" opacity="0.95">
    <path d="M300 78 C 400 78, 400 168, 470 172">
      <animate attributeName="stroke-dashoffset" from="197" to="0" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M300 268 C 400 268, 400 196, 470 192">
      <animate attributeName="stroke-dashoffset" from="197" to="0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M980 78 C 880 78, 880 168, 810 172">
      <animate attributeName="stroke-dashoffset" from="197" to="0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M980 268 C 880 268, 880 196, 810 192">
      <animate attributeName="stroke-dashoffset" from="197" to="0" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M640 300 L 640 228" stroke-dasharray="7 72">
      <animate attributeName="stroke-dashoffset" from="79" to="0" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== nodes ===== -->
  <g font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">

    <g transform="translate(40,44)">
      <rect width="260" height="68" rx="12" fill="#0E0E15" stroke="#1F1F2B"/>
      <rect x="1" y="1" width="258" height="24" rx="11" fill="url(#iTop)"/>
      <text x="20" y="30" font-size="11.5" letter-spacing="1.6" fill="#00D8FF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">01 / OPERAÇÃO</text>
      <text x="20" y="52" font-size="16" font-weight="700" fill="#E7ECF3">Chão de fábrica · SAP</text>
    </g>

    <g transform="translate(40,234)">
      <rect width="260" height="68" rx="12" fill="#0E0E15" stroke="#1F1F2B"/>
      <rect x="1" y="1" width="258" height="24" rx="11" fill="url(#iTop)"/>
      <text x="20" y="30" font-size="11.5" letter-spacing="1.6" fill="#00D8FF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">03 / QUALIDADE</text>
      <text x="20" y="52" font-size="16" font-weight="700" fill="#E7ECF3">Qualidade · Testes · CI</text>
    </g>

    <g transform="translate(980,44)">
      <rect width="260" height="68" rx="12" fill="#0E0E15" stroke="#1F1F2B"/>
      <rect x="1" y="1" width="258" height="24" rx="11" fill="url(#iTop)"/>
      <text x="20" y="30" font-size="11.5" letter-spacing="1.6" fill="#7C5CFF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">02 / ENGENHARIA</text>
      <text x="20" y="52" font-size="16" font-weight="700" fill="#E7ECF3">Backend · APIs · Dados</text>
    </g>

    <g transform="translate(980,234)">
      <rect width="260" height="68" rx="12" fill="#0E0E15" stroke="#1F1F2B"/>
      <rect x="1" y="1" width="258" height="24" rx="11" fill="url(#iTop)"/>
      <text x="20" y="30" font-size="11.5" letter-spacing="1.6" fill="#7C5CFF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">04 / IA</text>
      <text x="20" y="52" font-size="16" font-weight="700" fill="#E7ECF3">IA aplicada · Agentes</text>
    </g>

    <g transform="translate(510,300)">
      <rect width="260" height="60" rx="12" fill="#0E0E15" stroke="#1F1F2B"/>
      <rect x="1" y="1" width="258" height="22" rx="11" fill="url(#iTop)"/>
      <text x="130" y="26" text-anchor="middle" font-size="11.5" letter-spacing="1.6" fill="#4D8DFF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">05 / ADOÇÃO</text>
      <text x="130" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="#E7ECF3">Produto · Go-live · Pessoas</text>
    </g>

    <!-- ===== core ===== -->
    <g transform="translate(470,132)">
      <rect x="-6" y="-6" width="352" height="112" rx="20" fill="none" stroke="#00D8FF" stroke-opacity="0.20"/>
      <rect width="340" height="100" rx="16" fill="#0C0C13" stroke="#2E3646"/>
      <rect x="1" y="1" width="338" height="36" rx="15" fill="url(#iTop)"/>
      <rect x="0" y="0" width="340" height="2" rx="1" fill="url(#iPlasma)" filter="url(#iGlow)"/>
      <text x="170" y="34" text-anchor="middle" font-size="12" letter-spacing="2.4" fill="#00D8FF"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">COMO EU TRABALHO</text>
      <text x="170" y="65" text-anchor="middle" font-size="24" font-weight="800" fill="url(#iChrome)">PONTA A PONTA</text>
      <text x="170" y="87" text-anchor="middle" font-size="12" fill="#798394"
            font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">do diagnóstico ao suporte em produção</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="379" rx="20" fill="none" stroke="#1C1C26"/>
</svg>
